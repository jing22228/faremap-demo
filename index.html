<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FareMap — rough flight routes demo</title>
<style>
  :root{
    color-scheme: light;
    --surface-1:#fcfcfb;
    --page:#f9f9f7;
    --text-primary:#0b0b0b;
    --text-secondary:#52514e;
    --text-muted:#898781;
    --grid:#e1e0d9;
    --baseline:#c3c2b7;
    --border: rgba(11,11,11,0.10);
    --good-bg: rgba(12,163,12,0.12);
    --good-text:#006300;
    --land:#cfc9b6;
    --accent:#2a78d6;
    --accent-ring: rgba(42,120,214,0.28);
    --p0:#cde2fb; --p1:#9ec5f4; --p2:#5598e7; --p3:#2a78d6; --p4:#184f95;
  }
  /* Dark palette applies when the system prefers dark AND the user hasn't
     explicitly overridden to light, OR when the user has explicitly
     switched to dark regardless of system preference. */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --surface-1:#1a1a19;
      --page:#0d0d0d;
      --text-primary:#ffffff;
      --text-secondary:#c3c2b7;
      --text-muted:#898781;
      --grid:#2c2c2a;
      --baseline:#383835;
      --border: rgba(255,255,255,0.10);
      --good-bg: rgba(12,163,12,0.18);
      --good-text:#0ca30c;
      --land:#33332e;
      --accent:#3987e5;
      --accent-ring: rgba(57,135,229,0.32);
      --p0:#86b6ef; --p1:#5598e7; --p2:#3987e5; --p3:#2a78d6; --p4:#1c5cab;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --surface-1:#1a1a19;
    --page:#0d0d0d;
    --text-primary:#ffffff;
    --text-secondary:#c3c2b7;
    --text-muted:#898781;
    --grid:#2c2c2a;
    --baseline:#383835;
    --border: rgba(255,255,255,0.10);
    --good-bg: rgba(12,163,12,0.18);
    --good-text:#0ca30c;
    --land:#33332e;
    --accent:#3987e5;
    --accent-ring: rgba(57,135,229,0.32);
    --p0:#86b6ef; --p1:#5598e7; --p2:#3987e5; --p3:#2a78d6; --p4:#1c5cab;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background:var(--page);
    color:var(--text-primary);
    overflow:hidden;
  }
  .app{ display:flex; flex-direction:column; height:100vh; }

  header.topbar{
    display:flex; align-items:center; gap:12px;
    padding:10px 16px;
    background:var(--surface-1);
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
    position:relative; z-index:41;
  }
  .brand{ display:flex; align-items:baseline; gap:8px; margin-right:4px; }
  .brand-name{ font-weight:700; font-size:15px; letter-spacing:.1px; }
  .badge-demo{
    font-size:10.5px; font-weight:700; letter-spacing:.3px;
    padding:2px 8px; border-radius:999px;
    background:var(--grid); color:var(--text-secondary);
    text-transform:uppercase;
  }
  .field-label{ font-size:11.5px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.3px; white-space:nowrap; }
  .search-row{ display:flex; align-items:center; gap:8px; flex:1; min-width:220px; max-width:420px; }
  .search-wrap{ position:relative; flex:1; }
  .search-wrap svg.icon{ position:absolute; left:10px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--text-muted); pointer-events:none; }
  input.city-input{
    width:100%; padding:9px 12px 9px 30px; border-radius:8px;
    border:1px solid var(--border); background:var(--page);
    color:var(--text-primary); font-size:13.5px; outline:none;
  }
  input.city-input:focus{ border-color:var(--accent); }
  #originInput{ padding-right:28px; }
  .search-wrap .clear-btn{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    width:18px; height:18px; border-radius:50%; border:none; padding:0;
    background:var(--grid); color:var(--text-secondary); cursor:pointer;
    font-size:10px; line-height:1; align-items:center; justify-content:center;
    display:none;
  }
  .search-wrap .clear-btn.visible{ display:flex; }
  .search-wrap .clear-btn:hover{ background:var(--accent); color:#fff; }
  .dropdown{
    position:absolute; top:calc(100% + 4px); left:0; right:0;
    background:var(--surface-1); border:1px solid var(--border);
    border-radius:10px; max-height:280px; overflow-y:auto;
    box-shadow:0 10px 28px rgba(0,0,0,.18); z-index:50; display:none;
  }
  .dropdown.open{ display:block; }
  .dropdown-item{
    padding:8px 12px; cursor:pointer; font-size:13px;
    display:flex; justify-content:space-between; gap:10px; color:var(--text-primary);
  }
  .dropdown-item .muted{ color:var(--text-muted); font-size:11.5px; }
  .dropdown-item:hover, .dropdown-item.active{ background:var(--grid); }
  .dropdown-empty{ padding:10px 12px; font-size:12.5px; color:var(--text-muted); }
  .hint{ font-size:11.5px; color:var(--text-muted); margin-left:auto; white-space:nowrap; }
  .theme-toggle{
    width:30px; height:30px; border-radius:50%; flex:0 0 auto;
    border:1px solid var(--border); background:var(--page);
    color:var(--text-secondary); cursor:pointer; font-size:14px;
    display:flex; align-items:center; justify-content:center; line-height:1;
  }
  .theme-toggle:hover{ border-color:var(--accent); color:var(--accent); }

  .date-field{ position:relative; flex:0 0 auto; }
  .date-toggle{
    display:flex; align-items:center; gap:7px; padding:8px 12px;
    border-radius:8px; border:1px solid var(--border); background:var(--page);
    color:var(--text-primary); font-size:13px; cursor:pointer; white-space:nowrap;
  }
  .date-toggle:hover{ border-color:var(--accent); }
  .date-toggle svg.icon{ width:14px; height:14px; color:var(--text-muted); flex:0 0 auto; }
  .date-panel{
    position:absolute; top:calc(100% + 6px); left:0;
    background:var(--surface-1); border:1px solid var(--border);
    border-radius:12px; padding:12px; width:250px;
    box-shadow:0 10px 28px rgba(0,0,0,.18); z-index:55; display:none;
  }
  .date-panel.open{ display:block; }
  .trip-switch{
    display:flex; gap:4px; background:var(--page); border:1px solid var(--border);
    border-radius:8px; padding:3px; margin-bottom:10px;
  }
  .trip-opt{
    flex:1; padding:6px 0; border:none; background:none; border-radius:6px;
    font-size:12px; font-weight:600; color:var(--text-secondary); cursor:pointer;
  }
  .trip-opt.active{ background:var(--accent); color:#fff; }
  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .cal-title{ font-size:12.5px; font-weight:700; }
  .cal-nav{
    width:22px; height:22px; border-radius:6px; border:1px solid var(--border);
    background:var(--page); color:var(--text-secondary); cursor:pointer; font-size:13px; line-height:1;
    display:flex; align-items:center; justify-content:center; padding:0;
  }
  .cal-nav:hover{ border-color:var(--accent); color:var(--accent); }
  .cal-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:10.5px; color:var(--text-muted); margin-bottom:2px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  .cal-day{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    font-size:12px; border-radius:6px; cursor:pointer; color:var(--text-primary);
    border:none; background:none;
  }
  .cal-day:hover{ background:var(--grid); }
  .cal-day.outside{ color:var(--text-muted); opacity:.4; }
  .cal-day.past{ color:var(--text-muted); opacity:.3; cursor:default; pointer-events:none; }
  .cal-day.today{ box-shadow:inset 0 0 0 1px var(--accent); }
  .cal-day.selected{ background:var(--accent); color:#fff; font-weight:700; }
  .cal-day.in-range{ background:var(--grid); }
  .date-panel-footer{ display:flex; align-items:center; justify-content:space-between; margin-top:10px; gap:8px; }
  .date-panel-footer button{
    font-size:12px; color:var(--text-secondary); background:none; border:none;
    cursor:pointer; text-decoration:underline; padding:2px; white-space:nowrap;
  }
  .date-panel-footer button:hover{ color:var(--text-primary); }
  .date-note{ font-size:10.5px; line-height:1.3; color:var(--text-muted); text-align:right; }

  .dest-row{
    display:flex; align-items:flex-start; gap:10px;
    padding:9px 16px; background:var(--page);
    border-bottom:1px solid var(--border);
    flex-wrap:wrap; position:relative; z-index:40;
  }
  .dest-row .search-wrap{ max-width:230px; flex:0 0 220px; }
  .chips{
    display:flex; flex-wrap:wrap; gap:6px; align-items:center; flex:1;
    min-height:34px; padding-top:2px; overflow:hidden;
    transition:max-height .22s ease;
  }
  .chips.collapsed{ max-height:32px; }
  .fold-btn{
    width:24px; height:24px; border-radius:6px; flex:0 0 auto;
    border:1px solid var(--border); background:var(--page);
    color:var(--text-secondary); cursor:pointer; font-size:11px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    transition:transform .2s ease; margin-top:1px;
  }
  .fold-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .fold-btn.collapsed{ transform:rotate(180deg); }
  .chip{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--grid); color:var(--text-primary);
    border-radius:999px; padding:5px 6px 5px 12px; font-size:12.5px; font-weight:600;
  }
  .chip .chip-price{ color:var(--text-muted); font-weight:500; }
  .chip button{
    width:18px; height:18px; border-radius:50%; border:none;
    background:var(--surface-1); color:var(--text-secondary); cursor:pointer;
    font-size:11px; line-height:1; display:flex; align-items:center; justify-content:center;
  }
  .chip button:hover{ background:var(--accent); color:#fff; }
  .chips-empty{ font-size:12.5px; color:var(--text-muted); padding:7px 0; }
  button#clearDestBtn, button#selectAllBtn{
    font-size:12px; color:var(--text-secondary); background:none; border:none;
    cursor:pointer; text-decoration:underline; padding:7px 2px; white-space:nowrap;
  }
  button#clearDestBtn:hover, button#selectAllBtn:hover{ color:var(--text-primary); }

  main.mapwrap{ position:relative; flex:1; overflow:hidden; background:var(--page); }
  #mapScroll{
    position:absolute; inset:0; overflow:auto;
    cursor:grab; -webkit-overflow-scrolling:touch;
  }
  #mapScroll.dragging{ cursor:grabbing; }
  #mapScroll::-webkit-scrollbar{ height:8px; width:8px; }
  #mapScroll::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }
  svg#map{ display:block; touch-action:none; }
  .citydot{ cursor:pointer; transition:fill .1s; }
  .citydot:hover{ fill:var(--accent); }

  .legend{
    position:absolute; left:14px; bottom:14px;
    background:var(--surface-1); border:1px solid var(--border);
    border-radius:12px; padding:12px 14px; width:220px;
    box-shadow:0 6px 20px rgba(0,0,0,.12); z-index:20; pointer-events:none;
  }
  .legend-title{ font-size:11.5px; font-weight:700; color:var(--text-secondary); margin-bottom:6px; }
  .legend-bar{ height:8px; border-radius:4px; background:linear-gradient(to right, var(--p0), var(--p1), var(--p2), var(--p3), var(--p4)); }
  .legend-bar.flat{ background:var(--p3); }
  .legend-bar.empty{ background:var(--grid); }
  .legend-labels{ display:flex; justify-content:space-between; margin-top:4px; font-size:11px; color:var(--text-muted); font-variant-numeric: tabular-nums; }
  .disclaimer{ margin-top:8px; font-size:10.5px; line-height:1.35; color:var(--text-muted); }

  .hint-bar{
    position:absolute; left:50%; bottom:16px; transform:translateX(-50%);
    background:var(--surface-1); border:1px solid var(--border);
    color:var(--text-secondary); font-size:12.5px; padding:8px 16px;
    border-radius:20px; box-shadow:0 6px 18px rgba(0,0,0,.12);
    pointer-events:none; white-space:nowrap; z-index:15; max-width:90%;
    overflow:hidden; text-overflow:ellipsis;
  }

  .map-controls{
    position:absolute; right:14px; bottom:14px; z-index:20;
    display:flex; flex-direction:column; gap:8px;
  }
  .map-ctrl-btn{
    width:38px; height:38px; border-radius:50%;
    background:var(--surface-1); border:1px solid var(--border);
    color:var(--text-secondary); font-size:18px; font-weight:600; cursor:pointer;
    box-shadow:0 6px 16px rgba(0,0,0,.14);
    display:flex; align-items:center; justify-content:center; line-height:1; padding:0;
  }
  .map-ctrl-btn:hover{ color:var(--accent); border-color:var(--accent); }
  .map-ctrl-btn:active{ transform:scale(0.94); }

  .tooltip{
    position:fixed; pointer-events:none; z-index:60;
    background:var(--surface-1); border:1px solid var(--border);
    border-radius:8px; padding:6px 10px; font-size:12px;
    color:var(--text-primary); box-shadow:0 6px 18px rgba(0,0,0,.15);
    transform:translate(-50%,-130%); white-space:nowrap; opacity:0; transition:opacity .1s;
  }
  .tooltip.show{ opacity:1; }
  .tooltip .t-city{ font-weight:700; }
  .tooltip .t-sub{ color:var(--text-muted); font-size:11px; }

  .drawer{
    position:fixed; top:0; right:0; height:100%; width:340px;
    background:var(--surface-1); border-left:1px solid var(--border);
    transform:translateX(100%); transition:transform .28s ease;
    z-index:70; overflow-y:auto; padding:22px 20px;
  }
  .drawer.open{ transform:translateX(0); }
  .drawer-close{
    position:absolute; top:14px; right:14px; width:28px; height:28px;
    border-radius:8px; border:1px solid var(--border); background:var(--page);
    color:var(--text-secondary); cursor:pointer; font-size:14px; line-height:1;
  }
  .drawer h2{ font-size:18px; margin:0 0 2px 0; }
  .drawer .sub{ font-size:12.5px; color:var(--text-muted); margin-bottom:16px; }
  .drawer .stat-row{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--text-secondary); padding:4px 0; border-bottom:1px dashed var(--grid); margin-bottom:10px; }
  .fare-hint{ font-size:11px; color:var(--text-muted); margin:-6px 0 6px; }
  .fare-list{ display:flex; flex-direction:column; }
  .fare-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 8px; border-bottom:1px solid var(--grid);
    gap:8px; cursor:pointer; border-radius:8px; margin:0 -8px;
  }
  .fare-row:last-child{ border-bottom:none; }
  .fare-row:hover{ background:var(--grid); }
  .fare-row.active{ background:var(--accent-ring); }
  .fare-left{ display:flex; flex-direction:column; gap:3px; }
  .fare-airline{ font-size:13.5px; font-weight:600; }
  .fare-meta{ font-size:11.5px; color:var(--text-muted); }
  .fare-price{ font-size:15px; font-weight:700; font-variant-numeric: tabular-nums; }
  .fare-badge{
    display:inline-block; margin-left:6px; font-size:10px; font-weight:700;
    padding:2px 6px; border-radius:6px; background:var(--good-bg); color:var(--good-text);
    letter-spacing:.2px; vertical-align:middle;
  }
  .drawer-empty{ color:var(--text-muted); font-size:12.5px; }
  .drawer-remove{
    margin-top:18px; width:100%; padding:9px; border-radius:8px;
    border:1px solid var(--border); background:var(--page); color:var(--text-secondary);
    font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .drawer-remove:hover{ border-color:var(--accent); color:var(--accent); }

  @media (max-width: 680px){
    .drawer{
      width:100%; left:0; right:0; top:auto; bottom:0; height:72%;
      border-left:none; border-top:1px solid var(--border);
      border-radius:16px 16px 0 0; transform:translateY(100%);
    }
    .drawer.open{ transform:translateY(0); }
    .hint{ display:none; }
    .legend{ width:170px; padding:10px 12px; }
    .dest-row .search-wrap{ flex:1 1 100%; max-width:none; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-name">FareMap</span>
      <span class="badge-demo">Demo</span>
    </div>
    <span class="field-label">From</span>
    <div class="search-row">
      <div class="search-wrap">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="originInput" class="city-input" type="text" placeholder="Departure city…" autocomplete="off" />
        <button id="originClearBtn" class="clear-btn" type="button" aria-label="Clear departure city" title="Clear">✕</button>
        <div id="originDropdown" class="dropdown"></div>
      </div>
    </div>
    <span class="field-label">Dates</span>
    <div class="date-field">
      <button id="dateToggleBtn" class="date-toggle" type="button">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span id="dateToggleLabel">Add dates</span>
      </button>
      <div id="datePanel" class="date-panel">
        <div class="trip-switch">
          <button type="button" class="trip-opt active" data-mode="oneway">One way</button>
          <button type="button" class="trip-opt" data-mode="roundtrip">Round trip</button>
        </div>
        <div class="cal-head">
          <button type="button" class="cal-nav" id="calPrevBtn" aria-label="Previous month">‹</button>
          <span id="calTitle" class="cal-title"></span>
          <button type="button" class="cal-nav" id="calNextBtn" aria-label="Next month">›</button>
        </div>
        <div class="cal-weekdays"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
        <div id="calGrid" class="cal-grid"></div>
        <div class="date-panel-footer">
          <button id="dateClearBtn" type="button">Clear</button>
          <span class="date-note">Demo only — dates aren't applied to fares</span>
        </div>
      </div>
    </div>
    <span class="hint">Drag or scroll to pan (wraps around the globe) · Ctrl/⌘+scroll to zoom</span>
    <button id="themeToggleBtn" class="theme-toggle" type="button" title="Toggle dark mode">🌙</button>
  </header>

  <div class="dest-row">
    <span class="field-label" style="padding-top:9px;">To</span>
    <div class="search-wrap">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="destInput" class="city-input" type="text" placeholder="Add a destination…" autocomplete="off" />
      <div id="destDropdown" class="dropdown"></div>
    </div>
    <div id="chips" class="chips"></div>
    <button id="selectAllBtn" type="button">Select all</button>
    <button id="clearDestBtn" type="button">Clear all</button>
    <button id="chipsFoldBtn" class="fold-btn" type="button" title="Collapse destination list">▾</button>
  </div>

  <main class="mapwrap">
    <div id="mapScroll">
      <svg id="map">
        <rect x="0" y="0" width="100%" height="500" fill="var(--page)"></rect>
        <g id="land"></g>
        <g id="citydots"></g>
        <g id="routes"></g>
        <g id="destmarkers"></g>
        <g id="originmarker"></g>
        <g id="labels"></g>
        <g id="emptyhint"></g>
      </svg>
    </div>

    <div class="legend">
      <div class="legend-title">Best price found</div>
      <div id="legendBar" class="legend-bar"></div>
      <div class="legend-labels"><span id="legendMin">$–</span><span id="legendMax">$–</span></div>
      <div class="disclaimer">Demo only — routes and fares are illustrative mock data, not live prices.</div>
    </div>

    <div class="map-controls">
      <button id="zoomInBtn" class="map-ctrl-btn" title="Zoom in">+</button>
      <button id="zoomOutBtn" class="map-ctrl-btn" title="Zoom out">−</button>
      <button id="recenterBtn" class="map-ctrl-btn" title="Recenter on departure city">⌖</button>
    </div>

    <div id="hintBar" class="hint-bar" hidden></div>
  </main>
</div>

<div id="tooltip" class="tooltip"></div>

<div id="drawer" class="drawer">
  <button class="drawer-close" id="drawerClose">✕</button>
  <div id="drawerContent"><div class="drawer-empty">Select a destination to see example fares.</div></div>
</div>

<script>
(function(){
  "use strict";

  // ---------- data ----------
  var CITIES = [
    { code:'JFK', name:'New York', country:'USA', lat:40.71, lon:-74.00 },
    { code:'LAX', name:'Los Angeles', country:'USA', lat:34.05, lon:-118.24 },
    { code:'ORD', name:'Chicago', country:'USA', lat:41.88, lon:-87.63 },
    { code:'YYZ', name:'Toronto', country:'Canada', lat:43.65, lon:-79.38 },
    { code:'MEX', name:'Mexico City', country:'Mexico', lat:19.43, lon:-99.13 },
    { code:'GRU', name:'São Paulo', country:'Brazil', lat:-23.55, lon:-46.63 },

      '<h2>' + dest.name + ' <span style="color:var(--text-muted);font-weight:500;">(' + dest.code + ')</span></h2>' +
      '<div class="sub">' + dest.country + '</div>' +
      '<div class="stat-row"><span>From ' + origin.name + '</span><span>' + route.distanceKm.toLocaleString() + ' km</span></div>' +
      '<div class="fare-hint">Tap a fare (or its route on the map) to compare</div>' +
      '<div class="fare-list">' + rows + '</div>' +
      '<button class="drawer-remove" id="drawerRemoveBtn">Remove from comparison</button>';
    drawer.classList.add('open');
    drawerContent.querySelectorAll('.fare-row').forEach(function(row){
      row.addEventListener('click', function(){
        selectFare(parseInt(row.getAttribute('data-index'), 10));
      });
    });
    document.getElementById('drawerRemoveBtn').addEventListener('click', function(){
      removeDestination(dest.code);
    });
    renderRoutes();
  }
  function closeDrawer(){
    hideTooltip();
    drawer.classList.remove('open');
    if (focusedCode){
      focusedCode = null;
      focusedFareIndex = 0;
      renderRoutes();
    }
  }
  // Selecting a fare (from the drawer list or by clicking its route on the
  // map) re-renders the focused view with that option highlighted and the
  // rest dimmed; it doesn't touch which destination is focused.
  function selectFare(i){
    focusedFareIndex = i;
    renderRoutes();
    drawerContent.querySelectorAll('.fare-row').forEach(function(row, idx){
      row.classList.toggle('active', idx === i);
    });
  }
  document.getElementById('drawerClose').addEventListener('click', closeDrawer);

  // ---------- app state ----------
  var originCode = 'LHR';
  var destinations = ['JFK', 'SIN', 'SYD', 'DXB'];
  // Set while the fare drawer is open: narrows the map to just that one
  // route (plus its non-direct fare options, dimmed) instead of the full
  // comparison overview. Cleared when the drawer closes.
  var focusedCode = null;
  var focusedFareIndex = 0;

  function renderRoutes(){
    // Clear every dynamic layer up front (not after the origin check) so a
    // cleared/invalid origin actually wipes the old route/marker instead of
    // leaving it stuck on screen.
    clear(routesG); clear(destG); clear(originG); clear(labelsG); clear(emptyHintG);

    var origin = cityByCode(originCode);

    if (!origin){
      // No departure city selected: de-highlight every base city dot back
      // to its plain, unselected look and prompt for a departure city.
      Object.keys(cityDotEls).forEach(function(code){
        cityDotEls[code].forEach(function(dot){ dot.setAttribute('opacity', 0.7); });
      });
      legendEl.hidden = true;
      hintBar.textContent = 'Search or click a city on the map to set your departure city';
      hintBar.hidden = false;
      return;
    }

    // reflect selection state on the always-visible base dots (every tile copy)
    Object.keys(cityDotEls).forEach(function(code){
      var sel = destinations.indexOf(code) !== -1 || code === originCode;
      cityDotEls[code].forEach(function(dot){ dot.setAttribute('opacity', sel ? 0 : 0.7); });
    });

    // Origin always lives in the middle world copy; everything else is
    // positioned relative to it via the shortest wrap-around direction.
    var op = projectTiled(origin.lat, origin.lon, ORIGIN_TILE);

    if (destinations.length === 0){
      legendEl.hidden = true;
      hintBar.textContent = 'Search or click a city to add a destination';
      hintBar.hidden = false;
      drawOrigin(origin, op);
      return;
    }
    legendEl.hidden = false;
    hintBar.hidden = true;

    // Fare drawer open for one of the selected destinations: show only that
    // route (overview resumes once the drawer closes).
    if (focusedCode && destinations.indexOf(focusedCode) !== -1){
      renderFocusedDestination(origin, op);
      return;
    }

    var results = destinations.map(function(code){
      var c = cityByCode(code);
      if (!c) return null;
      var dLon = shortestDeltaLon(origin.lon, c.lon);
      var pos = [op[0] + dLon / 360 * TILE_W, project(c.lat, c.lon)[1]];
      return { city:c, route:routeModel(origin, c), pos:pos };
    }).filter(Boolean);

    var prices = results.map(function(r){ return r.route.dotPrice; });
    var min = Math.min.apply(null, prices), max = Math.max.apply(null, prices);
    if (min === max){
      legendBar.className = 'legend-bar flat';
      legendMin.textContent = '$' + min;
      legendMax.textContent = '';
    } else {
      legendBar.className = 'legend-bar';
      legendMin.textContent = '$' + min;
      legendMax.textContent = '$' + max;
    }

    // Greedily label the cheapest destinations first, skipping any whose marker
    // sits too close to the origin pill or an already-labeled marker (avoids
    // overlapping text when two chosen destinations sit close together).
    var sortedByPrice = results.slice().sort(function(a,b){ return a.route.dotPrice - b.route.dotPrice; });
    var labelCodes = {};
    var placedPoints = [{ x: op[0], y: op[1], min: 58 }];
    sortedByPrice.forEach(function(r){
      var tooClose = placedPoints.some(function(pt){
        var d = Math.hypot(r.pos[0]-pt.x, r.pos[1]-pt.y);
        return d < (pt.min || 40);
      });
      if (tooClose) return;
      labelCodes[r.city.code] = true;
      placedPoints.push({ x:r.pos[0], y:r.pos[1], min:40 });
    });

    results.forEach(function(r){
      var c = r.city, route = r.route, p = r.pos;
      var t = max > min ? (route.dotPrice - min) / (max - min) : 0.5;
      var color = priceColor(t);

      var path = el('path', {
        d: arcPath(op[0], op[1], p[0], p[1]),
        fill:'none', stroke:'var(--text-secondary)', 'stroke-width':zs(1.3), 'stroke-opacity':0.4
      });
      routesG.appendChild(path);

      var dot = el('circle', { cx:p[0], cy:p[1], r:zs(6.5), fill:color, stroke:'var(--surface-1)', 'stroke-width':zs(1.5), style:'cursor:pointer' });
      destG.appendChild(dot);

      function onEnter(evt){
        path.setAttribute('stroke-opacity', 0.9);
        path.setAttribute('stroke-width', zs(2));
        showTooltip(evt, '<div class="t-city">' + c.name + '</div><div class="t-sub">from $' + route.dotPrice + ' · ' + route.distanceKm.toLocaleString() + ' km · click to view fares</div>');
      }
      function onMove(evt){ showTooltip(evt, tooltip.innerHTML); }
      function onLeave(){
        path.setAttribute('stroke-opacity', 0.4);
        path.setAttribute('stroke-width', zs(1.3));
        hideTooltip();
      }
      function onClick(){ openDrawer(origin, c, route); }
      dot.addEventListener('mouseenter', onEnter);
      dot.addEventListener('mousemove', onMove);
      dot.addEventListener('mouseleave', onLeave);
      dot.addEventListener('click', function(){ if (!wasDragged()) onClick(); });

      if (labelCodes[c.code]){
        var g = el('g', { style:'cursor:pointer' });
        var ly = p[1] - zs(11);
        var text = c.name + ' · $' + route.dotPrice;
        var w = zs(8 + text.length * 4.6);
        var bg = el('rect', { x:p[0] - w/2, y:ly - zs(10), width:w, height:zs(15), rx:zs(7), fill:'var(--surface-1)', stroke:'var(--border)', 'stroke-width':zs(1) });
        var lbl = el('text', { x:p[0], y:ly + zs(1), 'text-anchor':'middle', 'font-size':zs(9.5), 'font-weight':600, fill:'var(--text-primary)' });
        lbl.textContent = text;
        g.appendChild(bg); g.appendChild(lbl);
        g.addEventListener('click', function(){ if (!wasDragged()) onClick(); });
        g.addEventListener('mouseenter', onEnter);
        g.addEventListener('mousemove', onMove);
        g.addEventListener('mouseleave', onLeave);
        labelsG.appendChild(g);
      }
    });

    drawOrigin(origin, op);
  }

  // ---------- focused single-destination view (fare drawer open) ----------
  // Deterministic "via" bend point for a non-direct fare option, so the same
  // route always draws the same plausible connection shape rather than a
  // fresh random one on every re-render.
  function connectionWaypoint(op, pos, seedBase, idx){
    var rand = mulberry32(seedBase + idx * 97);
    var dx = pos[0] - op[0], dy = pos[1] - op[1];
    var len = Math.hypot(dx, dy) || 1;
    var px = -dy / len, py = dx / len;
    var side = idx % 2 === 0 ? 1 : -1;
    var t = 0.35 + rand() * 0.3;
    var wx = op[0] + dx * t, wy = op[1] + dy * t;
    var offset = len * (0.10 + rand() * 0.10);
    return [wx + px * offset * side, wy + py * offset * side];
  }

  function renderFocusedDestination(origin, op){
    legendEl.hidden = true;
    var dest = cityByCode(focusedCode);
    if (!dest){
      focusedCode = null;
      drawOrigin(origin, op);
      return;
    }
    var dLon = shortestDeltaLon(origin.lon, dest.lon);
    var pos = [op[0] + dLon / 360 * TILE_W, project(dest.lat, dest.lon)[1]];
    var route = routeModel(origin, dest);
    if (focusedFareIndex >= route.opts.length) focusedFareIndex = 0;
    var seedBase = seedFromString([origin.code, dest.code].sort().join('-') + '-via');

    // Draw the dimmed (non-selected) fare paths first, the highlighted one
    // last, so it always paints on top wherever routes cross.
    var order = route.opts.map(function(o, i){ return i; })
      .sort(function(a, b){ return (a === focusedFareIndex ? 1 : 0) - (b === focusedFareIndex ? 1 : 0); });

    order.forEach(function(i){
      var o = route.opts[i];
      var active = i === focusedFareIndex;
      var d;
      if (o.stops === 0){
        d = arcPath(op[0], op[1], pos[0], pos[1]);
      } else {
        var wp = connectionWaypoint(op, pos, seedBase, i);
        d = 'M ' + op[0] + ' ' + op[1] + ' L ' + wp[0] + ' ' + wp[1] + ' L ' + pos[0] + ' ' + pos[1];
        var wpDot = el('circle', {
          cx:wp[0], cy:wp[1], r: zs(active ? 3 : 2.2),
          fill: active ? 'var(--accent)' : 'var(--text-muted)',
          opacity: active ? 1 : 0.5
        });
        routesG.appendChild(wpDot);
      }
      var path = el('path', {
        d: d, fill:'none',
        stroke: active ? 'var(--accent)' : 'var(--text-secondary)',
        'stroke-width': zs(active ? 2.4 : 1.1),
        'stroke-opacity': active ? 0.95 : 0.3,
        style:'cursor:pointer'
      });
      path.addEventListener('click', function(){ if (!wasDragged()) selectFare(i); });
      path.addEventListener('mouseenter', function(evt){
        showTooltip(evt, '<div class="t-city">' + o.airline + '</div><div class="t-sub">' +
          (o.stops === 0 ? 'Nonstop' : o.stops + ' stop') + ' · ' + fmtDuration(o.durationH) + ' · $' + o.price +
          (active ? '' : ' · click to compare') + '</div>');
      });
      path.addEventListener('mousemove', function(evt){ showTooltip(evt, tooltip.innerHTML); });
      path.addEventListener('mouseleave', hideTooltip);
      routesG.appendChild(path);
    });

    var activeOpt = route.opts[focusedFareIndex];
    var dot = el('circle', { cx:pos[0], cy:pos[1], r:zs(6.5), fill:'var(--accent)', stroke:'var(--surface-1)', 'stroke-width':zs(1.5) });
    destG.appendChild(dot);

    var ly = pos[1] - zs(11);
    var text = dest.name + ' · $' + activeOpt.price;
    var w = zs(8 + text.length * 4.6);
    var bg = el('rect', { x:pos[0] - w/2, y:ly - zs(10), width:w, height:zs(15), rx:zs(7), fill:'var(--surface-1)', stroke:'var(--border)', 'stroke-width':zs(1) });
    var lbl = el('text', { x:pos[0], y:ly + zs(1), 'text-anchor':'middle', 'font-size':zs(9.5), 'font-weight':600, fill:'var(--text-primary)' });
    lbl.textContent = text;
    labelsG.appendChild(bg);
    labelsG.appendChild(lbl);

    drawOrigin(origin, op);
  }

  function drawOrigin(origin, op){
    var ring = el('circle', { cx:op[0], cy:op[1], r:zs(6), fill:'none', stroke:'var(--accent-ring)', 'stroke-width':zs(6) });
    var core = el('circle', { cx:op[0], cy:op[1], r:zs(5), fill:'var(--accent)', stroke:'var(--surface-1)', 'stroke-width':zs(1.5) });
    originG.appendChild(ring); originG.appendChild(core);
    var w = zs(10 + origin.name.length*4.8);
    var oLabelBg = el('rect', { x:op[0] - w/2, y:op[1]-zs(26), width:w, height:zs(16), rx:zs(8), fill:'var(--accent)' });
    var oLabel = el('text', { x:op[0], y:op[1]-zs(14.5), 'text-anchor':'middle', 'font-size':zs(10), 'font-weight':700, fill:'#fff' });
    oLabel.textContent = origin.name;
    originG.appendChild(oLabelBg); originG.appendChild(oLabel);
  }

  // ---------- destination selection ----------
  var chipsEl = document.getElementById('chips');

  // A big selection (e.g. after Select all) can grow the chip row tall
  // enough to push the map down; let the user fold it to one line.
  var chipsFoldBtn = document.getElementById('chipsFoldBtn');
  var chipsCollapsed = false;
  chipsFoldBtn.addEventListener('click', function(){
    chipsCollapsed = !chipsCollapsed;
    chipsEl.classList.toggle('collapsed', chipsCollapsed);
    chipsFoldBtn.classList.toggle('collapsed', chipsCollapsed);
    chipsFoldBtn.title = chipsCollapsed ? 'Expand destination list' : 'Collapse destination list';
  });

  function renderChips(){
    if (destinations.length === 0){
      chipsEl.innerHTML = '<span class="chips-empty">No destinations selected yet</span>';
      return;
    }
    var origin = cityByCode(originCode);
    chipsEl.innerHTML = '';
    destinations.forEach(function(code){
      var c = cityByCode(code);
      if (!c) return;
      var price = origin ? routeModel(origin, c).dotPrice : null;
      var chip = document.createElement('span');
      chip.className = 'chip';
      chip.innerHTML = '<span>' + c.name + '</span>' +
        (price ? '<span class="chip-price">from $' + price + '</span>' : '') +
        '<button type="button" aria-label="Remove ' + c.name + '" data-code="' + code + '">✕</button>';
      chipsEl.appendChild(chip);
    });
  }
  chipsEl.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-code]');
    if (!btn) return;
    removeDestination(btn.getAttribute('data-code'));
  });
  // Removing/clearing destinations never touches zoom or the pan position —
  // only additions (a new destination, a new origin) trigger the auto-fit.
  document.getElementById('clearDestBtn').addEventListener('click', function(){
    destinations = [];
    renderChips();
    renderRoutes();
  });
  document.getElementById('selectAllBtn').addEventListener('click', function(){
    CITIES.forEach(function(c){
      if (c.code !== originCode && destinations.indexOf(c.code) === -1) destinations.push(c.code);
    });
    renderChips();
    autoFitZoom();
    renderRoutes();
    recenterView(true);
  });

  function addDestination(code){
    if (!code || code === originCode) return;
    if (destinations.indexOf(code) !== -1) return;
    if (!cityByCode(code)) return;
    destinations.push(code);
    renderChips();
    autoFitZoom();
    renderRoutes();
    recenterView(true);
  }
  function removeDestination(code){
    var idx = destinations.indexOf(code);
    if (idx === -1) return;
    destinations.splice(idx, 1);
    if (code === focusedCode){
      focusedCode = null;
      focusedFareIndex = 0;
      drawer.classList.remove('open');
    }
    renderChips();
    renderRoutes();
  }

  // Sets the departure city -- shared by the origin autocomplete's onSelect
  // and by clicking a base-map dot while no origin is currently selected.
  function selectOrigin(code){
    var c = cityByCode(code);
    if (!c) return;
    originCode = c.code;
    originInput.value = c.name + ' (' + c.code + ')';
    // an origin can't also be a destination
    if (destinations.indexOf(c.code) !== -1) removeDestination(c.code);
    renderChips();
    autoFitZoom();
    renderRoutes();
    recenterView(true);
    updateOriginClearBtn();
  }

  // wire up base-map dot clicks (every tile copy of every city) now that
  // addDestination/selectOrigin exist. When no departure city is selected
  // yet, the first click on any city sets it as the origin instead of
  // adding it as a destination.
  Object.keys(cityDotEls).forEach(function(code){
    cityDotEls[code].forEach(function(dot){
      dot.addEventListener('click', function(){
        if (wasDragged()) return;
        if (originCode === null) selectOrigin(code);
        else addDestination(code);
      });
      dot.addEventListener('mouseenter', function(evt){
        var c = cityByCode(code);
        var hint = originCode === null ? 'click to set as departure city' : 'click to add as a destination';
        showTooltip(evt, '<div class="t-city">' + c.name + '</div><div class="t-sub">' + hint + '</div>');
      });
      dot.addEventListener('mousemove', function(evt){ showTooltip(evt, tooltip.innerHTML); });
      dot.addEventListener('mouseleave', hideTooltip);
    });
  });

  // ---------- pan / scroll / infinite wrap ----------
  // Pointer capture is deferred until real movement is detected (past
  // DRAG_THRESHOLD) rather than grabbed on every pointerdown — capturing
  // eagerly retargets the eventual mouseup/click to the scroll container
  // instead of whatever was actually clicked, which silently breaks clicks
  // on city dots and destination markers.
  var DRAG_THRESHOLD = 4;
  var isDragging = false, dragStartX = 0, dragStartY = 0, dragStartLeft = 0, dragStartTop = 0, dragMoved = 0, dragCaptured = false;

  function wasDragged(){ return dragMoved > DRAG_THRESHOLD; }

  mapScroll.addEventListener('pointerdown', function(e){
    isDragging = true; dragMoved = 0; dragCaptured = false;
    dragStartX = e.clientX; dragStartY = e.clientY;
    dragStartLeft = mapScroll.scrollLeft; dragStartTop = mapScroll.scrollTop;
  });
  mapScroll.addEventListener('pointermove', function(e){
    if (!isDragging) return;
    var dx = e.clientX - dragStartX, dy = e.clientY - dragStartY;
    dragMoved = Math.max(dragMoved, Math.hypot(dx, dy));
    if (!dragCaptured && dragMoved > DRAG_THRESHOLD){
      dragCaptured = true;
      mapScroll.classList.add('dragging');
      try { mapScroll.setPointerCapture(e.pointerId); } catch (err) {}
    }
    if (dragCaptured){
      mapScroll.scrollLeft = dragStartLeft - dx;
      mapScroll.scrollTop = dragStartTop - dy;
    }
  });
  function endDrag(e){
    if (!isDragging) return;
    isDragging = false;
    mapScroll.classList.remove('dragging');
    if (dragCaptured){
      try { mapScroll.releasePointerCapture(e.pointerId); } catch (err) {}
      dragCaptured = false;
    }
  }
  mapScroll.addEventListener('pointerup', endDrag);
  mapScroll.addEventListener('pointercancel', endDrag);

  // Ctrl/Cmd+scroll (and trackpad pinch, which browsers report the same way)
  // zooms; plain vertical wheel input pans horizontally instead (most desktop
  // mice have no horizontal scroll wheel). Trackpad horizontal scroll keeps
  // working natively since we only intercept the vertical case.
  mapScroll.addEventListener('wheel', function(e){
    if (e.ctrlKey || e.metaKey){
      e.preventDefault();
      setZoom(zoom * (e.deltaY < 0 ? 1.12 : 1 / 1.12), false);
      return;
    }
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)){
      mapScroll.scrollLeft += e.deltaY;
      e.preventDefault();
    }
  }, { passive:false });

  // Seamless infinite scroll: once the visible window nears the edge of the
  // rendered tile range, silently jump back by whole tile-widths — since
  // every tile is an identical copy of the world, the jump is invisible.
  // Suppressed while a programmatic recenter/zoom is animating: a native
  // smooth scrollTo() generates its own stream of intermediate 'scroll'
  // events, and an instant mid-flight jump here fights with that animation
  // (the browser keeps easing toward its original target from whatever
  // position we just jumped to), landing the view somewhere wrong once it
  // settles.
  var wrapping = false, suppressWrap = false, suppressWrapTimer = null;
  mapScroll.addEventListener('scrollend', function(){
    suppressWrap = false;
    clearTimeout(suppressWrapTimer);
  });
  mapScroll.addEventListener('scroll', function(){
    if (wrapping || suppressWrap) return;
    var tileWpx = TILE_W * pxPerUnit();
    var sl = mapScroll.scrollLeft, vw = mapScroll.clientWidth;
    wrapping = true;
    if (sl < tileWpx * 0.5){
      mapScroll.scrollLeft = sl + tileWpx * 2;
    } else if (sl + vw > tileWpx * (TILE_COUNT - 0.5)){
      mapScroll.scrollLeft = sl - tileWpx * 2;
    }
    wrapping = false;
  });

  // Logical-unit bounding box of the origin plus every currently-selected
  // destination (each destination positioned via its shortest wrap-around
  // direction from the origin, same as renderRoutes draws it). Shared by the
  // auto-fit zoom calculation and the recenter/view-centering logic below.
  function getSelectionExtent(){
    var origin = cityByCode(originCode);
    if (!origin) return null;
    var op = projectTiled(origin.lat, origin.lon, ORIGIN_TILE);
    var xs = [op[0]], ys = [op[1]];
    destinations.forEach(function(code){
      var c = cityByCode(code);
      if (!c) return;
      var dLon = shortestDeltaLon(origin.lon, c.lon);
      var dx = op[0] + dLon / 360 * TILE_W;
      var dy = project(c.lat, c.lon)[1];
      xs.push(dx);
      ys.push(dy);
      // Each route arc bows upward (toward smaller y) by up to 70 units --
      // include its peak so the fit accounts for the whole visible curve,
      // not just the two endpoints it connects (mirrors arcPath()'s bow).
      var dist = Math.hypot(dx - op[0], dy - op[1]);
      var bow = Math.min(dist * 0.16, 70);
      ys.push((op[1] + dy) / 2 - bow);
    });
    return {
      op: op,
      minX: Math.min.apply(null, xs), maxX: Math.max.apply(null, xs),
      minY: Math.min.apply(null, ys), maxY: Math.max.apply(null, ys)
    };
  }

  // Centers the view on the midpoint of the current selection's bounding box
  // (just the origin when there are no destinations yet) — this keeps the
  // departure city as close to center as possible while still guaranteeing
  // every selected destination the auto-fit zoomed to fit is actually
  // scrolled into view, rather than centering on the origin alone and
  // leaving a lone destination hanging half off-screen.
  function recenterView(smooth){
    var ext = getSelectionExtent();
    if (!ext) return;
    var ppu = pxPerUnit();
    var centerX = (ext.minX + ext.maxX) / 2;
    var centerY = (ext.minY + ext.maxY) / 2;
    var targetLeft = centerX * ppu - mapScroll.clientWidth / 2;
    var maxLeft = TILE_COUNT * TILE_W * ppu - mapScroll.clientWidth;
    targetLeft = Math.max(0, Math.min(maxLeft, targetLeft));
    // Center vertically within the area above the floating legend/zoom
    // controls strip, not the full scroll height, so a centered route
    // doesn't end up partly hidden behind that overlay.
    var safeH = Math.max(120, mapScroll.clientHeight - FIT_BOTTOM_SAFE_PX);
    var targetTop = centerY * ppu - safeH / 2;
    var maxTop = Math.max(0, TILE_H * ppu - mapScroll.clientHeight);
    targetTop = Math.max(0, Math.min(maxTop, targetTop));
    if (smooth){
      suppressWrap = true;
      clearTimeout(suppressWrapTimer);
      suppressWrapTimer = setTimeout(function(){ suppressWrap = false; }, 500);
    }
    mapScroll.scrollTo({ left: targetLeft, top: targetTop, behavior: smooth ? 'smooth' : 'auto' });
  }
  document.getElementById('recenterBtn').addEventListener('click', function(){
    recenterView(true);
  });

  // Manual zoom in/out, clamped to [MIN_ZOOM, MAX_ZOOM]. `smooth` controls the
  // recenter animation — off for continuous wheel-zoom so it feels responsive,
  // on for a single button press.
  function setZoom(z, smooth){
    zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, z));
    layoutMap();
    updateStaticSizes();
    renderRoutes();
    recenterView(smooth);
  }
  document.getElementById('zoomInBtn').addEventListener('click', function(){ setZoom(zoom * 1.4, true); });
  document.getElementById('zoomOutBtn').addEventListener('click', function(){ setZoom(zoom / 1.4, true); });

  // Auto-fit: size the view so the full span of the current selection
  // (origin to its farthest destination, in either direction) fills
  // FIT_FRACTION of the viewport width — i.e. zoom in for a short hop, zoom
  // back out again if a farther destination gets added. Only ever called
  // after an addition (new origin or new destination); removals leave the
  // zoom exactly where it was.
  function autoFitZoom(){
    if (destinations.length === 0) return;
    var ext = getSelectionExtent();
    if (!ext) return;
    var spanX = Math.max(4, ext.maxX - ext.minX);
    var spanY = Math.max(4, ext.maxY - ext.minY);
    var viewportW = mapScroll.clientWidth || mapWrap.clientWidth || 800;
    var viewportH = mapScroll.clientHeight || mapWrap.clientHeight || 500;
    // Reserve room for the constant-pixel-size label pills and the floating
    // legend/zoom-control overlays, then fit BOTH axes -- not width alone --
    // so a north-south-heavy selection can't end up taller than the
    // viewport even though it fits the width fine.
    var availW = Math.max(120, viewportW - 2 * FIT_LABEL_MARGIN_PX);
    var availH = Math.max(120, viewportH - FIT_LABEL_MARGIN_PX - FIT_BOTTOM_SAFE_PX);
    var zoomForWidth = (FIT_FRACTION * availW) / (spanX * baseUnit());
    var zoomForHeight = (FIT_FRACTION * availH) / (spanY * baseUnit());
    var desired = Math.min(zoomForWidth, zoomForHeight);
    zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, desired));
    layoutMap();
    updateStaticSizes();
  }

  var resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){ layoutMap(); recenterView(false); }, 120);
  });

  // ---------- generic autocomplete wiring ----------
  function wireAutocomplete(inputEl, dropdownEl, opts){
    var activeIndex = -1;
    var matches = [];

    function render(query){
      var q = query.trim().toLowerCase();
      matches = CITIES.filter(function(c){
        if (opts.exclude && opts.exclude(c.code)) return false;
        return !q || c.name.toLowerCase().indexOf(q) !== -1 ||
               c.code.toLowerCase().indexOf(q) !== -1 ||
               c.country.toLowerCase().indexOf(q) !== -1;
      }).slice(0, 12);
      activeIndex = -1;
      if (matches.length === 0){
        dropdownEl.innerHTML = '<div class="dropdown-empty">No matching city</div>';
      } else {
        dropdownEl.innerHTML = matches.map(function(c, i){
          return '<div class="dropdown-item" data-code="' + c.code + '" data-idx="' + i + '">' +
            '<span>' + c.name + '</span><span class="muted">' + c.code + ' · ' + c.country + '</span></div>';
        }).join('');
      }
      dropdownEl.classList.add('open');
    }
    function close(){ dropdownEl.classList.remove('open'); }
    function pick(c){
      opts.onSelect(c);
      close();
    }

    inputEl.addEventListener('focus', function(){ render(inputEl.value); });
    inputEl.addEventListener('input', function(){ render(inputEl.value); });
    inputEl.addEventListener('keydown', function(e){
      if (!dropdownEl.classList.contains('open')) return;
      var items = dropdownEl.querySelectorAll('.dropdown-item');
      if (e.key === 'ArrowDown'){ e.preventDefault(); activeIndex = Math.min(activeIndex+1, items.length-1); }
      else if (e.key === 'ArrowUp'){ e.preventDefault(); activeIndex = Math.max(activeIndex-1, 0); }
      else if (e.key === 'Enter'){
        e.preventDefault();
        var idx = activeIndex >= 0 ? activeIndex : 0;
        if (matches[idx]) pick(matches[idx]);
        return;
      } else if (e.key === 'Escape'){ close(); return; }
      else return;
      items.forEach(function(node, i){ node.classList.toggle('active', i === activeIndex); });
    });
    dropdownEl.addEventListener('click', function(e){
      var item = e.target.closest('.dropdown-item');
      if (!item) return;
      var c = cityByCode(item.getAttribute('data-code'));
      if (c) pick(c);
    });
    document.addEventListener('click', function(e){
      if (!inputEl.parentElement.contains(e.target)) close();
    });
  }

  var originInput = document.getElementById('originInput');
  var originClearBtn = document.getElementById('originClearBtn');
  function updateOriginClearBtn(){
    originClearBtn.classList.toggle('visible', !!originInput.value);
  }
  originInput.addEventListener('input', updateOriginClearBtn);
  originClearBtn.addEventListener('click', function(){
    originInput.value = '';
    originCode = null;
    // no valid departure city means no route can be drawn -- clear any
    // destinations too rather than leaving orphaned, unroutable chips.
    destinations = [];
    renderChips();
    renderRoutes();
    updateOriginClearBtn();
    originInput.focus();
  });

  wireAutocomplete(originInput, document.getElementById('originDropdown'), {
    onSelect: function(c){ selectOrigin(c.code); }
  });

  var destInput = document.getElementById('destInput');
  wireAutocomplete(destInput, document.getElementById('destDropdown'), {
    exclude: function(code){ return code === originCode || destinations.indexOf(code) !== -1; },
    onSelect: function(c){
      addDestination(c.code);
      destInput.value = '';
      destInput.focus();
    }
  });

  // ---------- light/dark toggle ----------
  // No persistence (this page may render inline in a chat), just an explicit
  // override of whatever the system currently prefers. Destination-marker
  // colors are baked into `fill` at render time via priceColor(), so those
  // need a re-render on toggle; land/city dots reference var(--land) etc.
  // directly and repaint on their own when the custom properties change.
  var themeToggleBtn = document.getElementById('themeToggleBtn');
  function currentTheme(){
    var attr = document.documentElement.getAttribute('data-theme');
    if (attr) return attr;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function setTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    themeToggleBtn.textContent = t === 'dark' ? '☀️' : '🌙';
    themeToggleBtn.title = t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
    renderRoutes();
  }
  themeToggleBtn.addEventListener('click', function(){
    setTheme(currentTheme() === 'dark' ? 'light' : 'dark');
  });
  themeToggleBtn.textContent = currentTheme() === 'dark' ? '☀️' : '🌙';

  // ---------- date picker (foldable calendar + one-way/round-trip) ----------
  // Purely a UI affordance for this demo -- selected dates aren't wired into
  // the mock fare model, they just drive the toggle button's label.
  var dateToggleBtn = document.getElementById('dateToggleBtn');
  var dateToggleLabel = document.getElementById('dateToggleLabel');
  var datePanel = document.getElementById('datePanel');
  var calTitle = document.getElementById('calTitle');
  var calGrid = document.getElementById('calGrid');

  var tripMode = 'oneway';
  var departDate = null, returnDate = null;
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var calViewYear = today.getFullYear(), calViewMonth = today.getMonth();
  var MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function dateKey(d){ return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); }
  function fmtDateShort(d){ return MONTH_NAMES[d.getMonth()].slice(0, 3) + ' ' + d.getDate(); }

  function updateDateToggleLabel(){
    if (!departDate){ dateToggleLabel.textContent = 'Add dates'; return; }
    if (tripMode === 'oneway'){ dateToggleLabel.textContent = fmtDateShort(departDate); return; }
    dateToggleLabel.textContent = fmtDateShort(departDate) + ' – ' + (returnDate ? fmtDateShort(returnDate) : 'return?');
  }

  function renderCalendar(){
    calTitle.textContent = MONTH_NAMES[calViewMonth] + ' ' + calViewYear;
    clear(calGrid);
    var firstDow = new Date(calViewYear, calViewMonth, 1).getDay();
    var totalDays = new Date(calViewYear, calViewMonth + 1, 0).getDate();
    var prevMonthDays = new Date(calViewYear, calViewMonth, 0).getDate();
    var totalCells = Math.ceil((firstDow + totalDays) / 7) * 7;
    var frag = document.createDocumentFragment();
    for (var i = 0; i < totalCells; i++){
      var dayNum = i - firstDow + 1;
      var cellDate, outside = false;
      if (dayNum < 1){ cellDate = new Date(calViewYear, calViewMonth - 1, prevMonthDays + dayNum); outside = true; }
      else if (dayNum > totalDays){ cellDate = new Date(calViewYear, calViewMonth + 1, dayNum - totalDays); outside = true; }
      else { cellDate = new Date(calViewYear, calViewMonth, dayNum); }
      cellDate.setHours(0, 0, 0, 0);
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cal-day';
      btn.textContent = cellDate.getDate();
      if (outside) btn.classList.add('outside');
      if (cellDate < today) btn.classList.add('past');
      if (dateKey(cellDate) === dateKey(today)) btn.classList.add('today');
      if (departDate && dateKey(cellDate) === dateKey(departDate)) btn.classList.add('selected');
      if (returnDate && dateKey(cellDate) === dateKey(returnDate)) btn.classList.add('selected');
      if (departDate && returnDate && cellDate > departDate && cellDate < returnDate) btn.classList.add('in-range');
      (function(cd){ btn.addEventListener('click', function(){ pickDate(cd); }); })(cellDate);
      frag.appendChild(btn);
    }
    calGrid.appendChild(frag);
  }

  function pickDate(d){
    if (d < today) return;
    if (tripMode === 'oneway'){
      departDate = d; returnDate = null;
      updateDateToggleLabel(); renderCalendar();
      closeDatePanel();
      return;
    }
    // round trip: first click sets depart, second click (on/after depart) sets
    // return; clicking again once both are set starts a fresh selection.
    if (!departDate || returnDate){
      departDate = d; returnDate = null;
    } else if (d < departDate){
      departDate = d;
    } else {
      returnDate = d;
    }
    updateDateToggleLabel(); renderCalendar();
    if (departDate && returnDate) closeDatePanel();
  }

  function openDatePanel(){
    datePanel.classList.add('open');
    calViewYear = (departDate || today).getFullYear();
    calViewMonth = (departDate || today).getMonth();
    renderCalendar();
  }
  function closeDatePanel(){ datePanel.classList.remove('open'); }

  dateToggleBtn.addEventListener('click', function(e){
    e.stopPropagation();
    if (datePanel.classList.contains('open')) closeDatePanel();
    else openDatePanel();
  });
  datePanel.addEventListener('click', function(e){ e.stopPropagation(); });
  document.addEventListener('click', function(e){
    if (!dateToggleBtn.parentElement.contains(e.target)) closeDatePanel();
  });

  document.getElementById('calPrevBtn').addEventListener('click', function(){
    calViewMonth--; if (calViewMonth < 0){ calViewMonth = 11; calViewYear--; }
    renderCalendar();
  });
  document.getElementById('calNextBtn').addEventListener('click', function(){
    calViewMonth++; if (calViewMonth > 11){ calViewMonth = 0; calViewYear++; }
    renderCalendar();
  });

  document.querySelectorAll('.trip-opt').forEach(function(btn){
    btn.addEventListener('click', function(){
      var mode = btn.getAttribute('data-mode');
      if (mode === tripMode) return;
      tripMode = mode;
      document.querySelectorAll('.trip-opt').forEach(function(b){ b.classList.toggle('active', b === btn); });
      if (tripMode === 'oneway') returnDate = null;
      updateDateToggleLabel();
      renderCalendar();
    });
  });

  document.getElementById('dateClearBtn').addEventListener('click', function(){
    departDate = null; returnDate = null;
    updateDateToggleLabel();
    renderCalendar();
  });

  updateDateToggleLabel();

  // ---------- init ----------
  var defaultOrigin = cityByCode(originCode);
  originInput.value = defaultOrigin.name + ' (' + defaultOrigin.code + ')';
  updateOriginClearBtn();
  layoutMap();
  autoFitZoom();
  renderChips();
  renderRoutes();
  recenterView(false);
})();
</script>
</body>
</html>
